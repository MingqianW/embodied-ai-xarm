# Opt-in paired trajectory-diversity plan. Counts are scenes_per_task x members.
schema_version: 2
dataset_version: xarm_mujoco_clean_multitask_paired_trajectory_v1
output_schema_version: xarm_real_raw_compatible_sim_v2
overwrite_existing_outputs: false
camera_config: simulation/config/camera_calibration.yaml
task_scene_config: simulation/config/task_scenes.yaml
outputs:
  raw: ${XARM_WORK_ROOT}/mujoco_datasets/raw/xarm_mujoco_clean_multitask_paired_trajectory_v1
  converted: ${XARM_WORK_ROOT}/mujoco_datasets/local/xarm_mujoco_clean_multitask_paired_trajectory_v1
  smoke: ${XARM_WORK_ROOT}/mujoco_datasets/smoke/xarm_mujoco_clean_multitask_paired_trajectory_v1
  log: ${XARM_WORK_ROOT}/logs/xarm_mujoco_clean_multitask_paired_trajectory_v1
collection:
  action_hz: 10
  scene_profile: clean_wide_v4
  generation_mode: paired_scene_groups
  scenes_per_task: 2
  max_attempts_per_episode: 4
  seed_retry_stride: 1000
  scene_variant: clean
  distractor_count: 0
  trajectory_profile:
    name: paired_diversity_v1
    version: 1
    defaults: {}
    tasks:
      red_pepper:
        parameters:
          pregrasp_clearance_from_object_m: {uniform: {min: 0.082, max: 0.092}}
          approach_speed_scale: {uniform: {min: 0.85, max: 1.10}}
      blue_block:
        parameters:
          approach_speed_scale: {uniform: {min: 0.85, max: 1.10}}
      red_block:
        parameters:
          approach_speed_scale: {uniform: {min: 0.85, max: 1.10}}
      smallest_block:
        parameters:
          approach_speed_scale: {uniform: {min: 0.85, max: 1.10}}
      largest_block:
        parameters:
          approach_speed_scale: {uniform: {min: 0.85, max: 1.10}}
      place_red_pepper_in_ring:
        parameters:
          transfer_speed_scale: {uniform: {min: 0.85, max: 1.05}}
        members:
          direct_place_high_center_v1:
            parameters:
              preplace_pepper_height_m: {uniform: {min: 0.225, max: 0.245}}
recording:
  record_all_smoke_videos: true
  representative_video_every: 1
verification:
  pick_stable_grasp:
    entry_lift_height_m: 0.05
    minimum_lift_height_m: 0.04
    maximum_relative_downward_slip_m: 0.01
    maximum_final_relative_downward_slip_m: 0.01
    maximum_final_downward_speed_mps: 0.01
    maximum_grasp_region_delta_m: 0.015
    steps: 20
    action_dt_s: 0.1
    velocity_fit_samples: 10
  place_initial_grasp:
    steps: 10
    action_dt_s: 0.1
    maximum_relative_drift_m: 0.005
    maximum_grasp_region_delta_m: 0.015
    minimum_height_above_table_m: 0.04
    gripper_raw: 450.0
    tcp_to_pepper_translation_m: [0.0, 0.0, -0.04]
    tcp_to_pepper_quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
  place_stable_release:
    steps: 20
    action_dt_s: 0.1
    ring_radius_m: 0.052
    maximum_height_above_table_m: 0.09
    maximum_final_speed_mps: 0.01
    velocity_fit_samples: 10
tasks:
  red_pepper:
    prompt: pick up the red pepper
    aliases: [pick_up_the_red_pepper, red pepper]
    episodes: 16
    clean_episodes: 16
    distractor_episodes: 0
    base_seed: 10100000
    required_active_objects: [red_pepper]
    oracle: {closed_gripper_raw: 250.0, grasp_tcp_offset_from_object_m: -0.022}
    generators: &pick_generators
      scripted_pick: {episodes: 2}
      scripted_pick_side_approach_v1: {episodes: 2}
      scripted_pick_opposite_side_approach_v1: {episodes: 2}
      scripted_pick_yaw15_v1: {episodes: 2}
      scripted_pick_yaw_minus15_v1: {episodes: 2}
      scripted_pick_diagonal_approach_v1: {episodes: 2}
      scripted_pick_waypoint_lift_v1: {episodes: 2}
      scripted_pick_opposite_waypoint_lift_v1: {episodes: 2}
  blue_block:
    prompt: pick up the blue block
    aliases: [pick_up_the_blue_block, pick up the light blue block, blue block]
    episodes: 16
    clean_episodes: 16
    distractor_episodes: 0
    base_seed: 10200000
    required_active_objects: [blue_block]
    oracle: {closed_gripper_raw: 211.0, grasp_tcp_offset_from_object_m: -0.011}
    generators: *pick_generators
  red_block:
    prompt: pick up the red block
    aliases: [pick_up_the_red_block, red block]
    episodes: 16
    clean_episodes: 16
    distractor_episodes: 0
    base_seed: 10300000
    required_active_objects: [object]
    oracle: {closed_gripper_raw: 200.0, grasp_tcp_offset_from_object_m: -0.011}
    generators: *pick_generators
  smallest_block:
    prompt: pick up the smallest block
    aliases: [pick_up_the_smallest_block, smallest block, smallest]
    episodes: 16
    clean_episodes: 16
    distractor_episodes: 0
    base_seed: 10400000
    required_active_objects: [small_block, large_block]
    oracle: {closed_gripper_raw: 200.0, grasp_tcp_offset_from_object_m: -0.011}
    generators: *pick_generators
  largest_block:
    prompt: pick up the largest block
    aliases: [pick_up_the_largest_block, largest block, largest]
    episodes: 16
    clean_episodes: 16
    distractor_episodes: 0
    base_seed: 10500000
    required_active_objects: [small_block, large_block]
    oracle: {closed_gripper_raw: 211.0, grasp_tcp_offset_from_object_m: -0.011}
    generators: *pick_generators
  place_red_pepper_in_ring:
    prompt: place the red pepper in the ring
    aliases: [place_the_red_pepper_in_the_ring]
    episodes: 12
    clean_episodes: 12
    distractor_episodes: 0
    base_seed: 10600000
    required_active_objects: [red_pepper, ring]
    generators:
      direct_place: {episodes: 2}
      direct_place_left_approach_v1: {episodes: 2}
      direct_place_right_approach_v1: {episodes: 2}
      direct_place_high_center_v1: {episodes: 2}
      direct_place_left_rear_approach_v1: {episodes: 2}
      direct_place_right_front_approach_v1: {episodes: 2}
