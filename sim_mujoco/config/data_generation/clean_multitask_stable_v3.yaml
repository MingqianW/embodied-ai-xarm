schema_version: 1
dataset_version: xarm_mujoco_clean_multitask_stable_v3
output_schema_version: xarm_real_raw_compatible_sim_v2
overwrite_existing_outputs: false
camera_config: sim_mujoco/config/camera_calibration.yaml
task_scene_config: sim_mujoco/config/task_scenes.yaml

outputs:
  raw: /work/nvme/bfmk/mw89/mujoco_datasets/raw/xarm_mujoco_clean_multitask_stable_v3
  converted: /work/nvme/bfmk/mw89/mujoco_datasets/local/xarm_mujoco_clean_multitask_stable_v3
  smoke: /work/nvme/bfmk/mw89/mujoco_datasets/smoke/xarm_mujoco_clean_multitask_stable_v3
  log: /work/nvme/bfmk/mw89/logs/xarm_mujoco_clean_multitask_stable_v3

collection:
  action_hz: 10
  object_xy_range_m: 0.02
  object_yaw_range_deg: 10.0
  joint_noise_rad: 0.005
  max_attempts_per_episode: 20
  seed_retry_stride: 1000
  scene_variant: clean
  distractor_count: 0

recording:
  record_all_smoke_videos: true
  representative_video_every: 25
  native_image_size: [480, 640, 3]
  base_camera: base_camera
  wrist_camera: wrist_camera
  overview_camera: overview_camera

verification:
  pick_stable_grasp:
    entry_lift_height_m: 0.05
    minimum_lift_height_m: 0.04
    maximum_relative_downward_slip_m: 0.01
    maximum_final_relative_downward_slip_m: 0.01
    maximum_final_downward_speed_mps: 0.01
    maximum_grasp_region_delta_m: 0.015
    steps: 20
    action_dt_s: 0.1
    velocity_fit_samples: 10
  place_initial_grasp:
    steps: 10
    action_dt_s: 0.1
    maximum_relative_drift_m: 0.005
    maximum_grasp_region_delta_m: 0.015
    minimum_height_above_table_m: 0.04
    # Strict reset diagnostics passed 20/20 retry seeds with 0.55-0.84 mm
    # drift and at least four physical finger contacts per sample.
    gripper_half_width_m: 0.012
    tcp_to_pepper_translation_m: [0.0, 0.0, -0.030]
    tcp_to_pepper_quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
  place_stable_release:
    steps: 20
    action_dt_s: 0.1
    ring_radius_m: 0.052
    maximum_height_above_table_m: 0.09
    maximum_final_speed_mps: 0.01
    velocity_fit_samples: 10

tasks:
  red_pepper:
    prompt: pick up the red pepper
    aliases: [pick_up_the_red_pepper, red pepper]
    episodes: 50
    clean_episodes: 50
    distractor_episodes: 0
    base_seed: 100000
    required_active_objects: [red_pepper]
    oracle:
      closed_gripper_raw: 250.0
      # Centers the pepper in the fingertip-pad height after lift. The convex
      # free-body torso contact passed 13/20 strict retry-sequence trials.
      grasp_tcp_offset_from_object_m: -0.022
  blue_block:
    prompt: pick up the blue block
    aliases: [pick_up_the_blue_block, pick up the light blue block, blue block]
    episodes: 25
    clean_episodes: 25
    distractor_episodes: 0
    base_seed: 200000
    required_active_objects: [blue_block]
    oracle:
      closed_gripper_raw: 211.0
      grasp_tcp_offset_from_object_m: -0.011
  red_block:
    prompt: pick up the red block
    aliases: [pick_up_the_red_block, red block]
    episodes: 25
    clean_episodes: 25
    distractor_episodes: 0
    base_seed: 300000
    required_active_objects: [object]
    oracle:
      # The 26 mm cube needs slightly more closure than the 37 mm blocks.
      # Raw 200 passed 5/5 strict retry-sequence trials at this offset.
      closed_gripper_raw: 200.0
      grasp_tcp_offset_from_object_m: -0.011
  smallest_block:
    prompt: pick up the smallest block
    aliases: [pick_up_the_smallest_block, smallest block, smallest]
    episodes: 25
    clean_episodes: 25
    distractor_episodes: 0
    base_seed: 400000
    required_active_objects: [small_block, large_block]
    oracle:
      # Same physical 26 mm cube geometry as red_block.
      closed_gripper_raw: 200.0
      grasp_tcp_offset_from_object_m: -0.011
  largest_block:
    prompt: pick up the largest block
    aliases: [pick_up_the_largest_block, largest block, largest]
    episodes: 25
    clean_episodes: 25
    distractor_episodes: 0
    base_seed: 500000
    required_active_objects: [small_block, large_block]
    oracle:
      closed_gripper_raw: 211.0
      grasp_tcp_offset_from_object_m: -0.011
  place_red_pepper_in_ring:
    prompt: place the red pepper in the ring
    aliases: [place_the_red_pepper_in_the_ring]
    episodes: 50
    clean_episodes: 50
    distractor_episodes: 0
    base_seed: 600000
    required_active_objects: [red_pepper, ring]
